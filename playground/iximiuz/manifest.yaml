kind: playground
# Registered name (labctl appended the id suffix on `playground create`).
# Refresh with: labctl playground update graphql-vuln-lab-6ac4f832 -f this-file
name: graphql-vuln-lab-6ac4f832
base: flexbox
title: GraphQL Security Lab
description: A stock Django + Strawberry GraphQL API with five classic weaknesses to probe and harden.
categories:
    - security
    - linux
playground:
    networks:
        - name: local
          subnet: 172.16.0.0/24
    machines:
        - name: dev-01
          users:
            - name: root
            - name: laborant
              default: true
              welcome: |
                A Django + Strawberry GraphQL API is running at
                http://127.0.0.1:8000/graphql/ on this VM.

                Probe each weakness with curl and jq, harden the project under
                ~/graphql-lab, then apply your changes with:
                  sudo systemctl restart graphql-lab.service
                To restore the original project:
                  sudo ~/toolbox/reset.sh
          drives:
            - source: oci://ghcr.io/lpmi-13/graphql-vuln-lab-rootfs:v5
              mount: /
              size: 20GiB
          network:
            interfaces:
                - address: 172.16.0.2/24
                  network: local
          resources:
            cpuCount: 2
            ramSize: 4GiB
    tabs:
        - id: terminal-dev-01
          kind: terminal
          name: dev-01
          machine: dev-01
        # The service listens on 0.0.0.0 because exposed ports only reach
        # services bound to the machine's main interface.
        - id: http-port-dev-01
          kind: http-port
          name: Acme Social
          machine: dev-01
          number: 8000
    initTasks:
        init_dev_01_ready:
            name: init_dev_01_ready
            machine: dev-01
            init: true
            user: root
            timeout_seconds: 300
            run: |-
                #!/bin/bash
                /opt/graphql-lab-tasks/wait_ready.sh
    accessControl:
        canList:
            - anyone
        canRead:
            - anyone
        canStart:
            - anyone
